<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="SYNAPEX 5-Phase Roadmap">
  <rect width="1200" height="380" fill="#0A1A3A" />

  <text x="40" y="50" fill="#F4F1EA" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">5-PHASE ROADMAP</text>
  <text x="40" y="78" fill="#5A6B85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14">Focus → Wellness → NeuroEconomics → fMRI Lab → Insurance</text>

  <line x1="120" y1="220" x2="1060" y2="220" stroke="#5A6B85" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <circle cx="160" cy="220" r="22" fill="#00E5FF" />
    <text x="160" y="227" text-anchor="middle" fill="#0A1A3A" font-size="18" font-weight="700">1</text>
    <text x="160" y="280" text-anchor="middle" fill="#F4F1EA" font-size="16" font-weight="700">Focus</text>
    <text x="160" y="302" text-anchor="middle" fill="#5A6B85" font-size="12">EEG×AI 집중 코치</text>
    <text x="160" y="320" text-anchor="middle" fill="#00E5FF" font-size="11" letter-spacing="2">NOW</text>

    <circle cx="350" cy="220" r="20" fill="none" stroke="#00E5FF" stroke-width="2" />
    <text x="350" y="227" text-anchor="middle" fill="#00E5FF" font-size="18" font-weight="700">2</text>
    <text x="350" y="280" text-anchor="middle" fill="#F4F1EA" font-size="16" font-weight="700">Wellness</text>
    <text x="350" y="302" text-anchor="middle" fill="#5A6B85" font-size="12">Sleep · 명상</text>

    <circle cx="560" cy="220" r="20" fill="none" stroke="#00E5FF" stroke-width="2" />
    <text x="560" y="227" text-anchor="middle" fill="#00E5FF" font-size="18" font-weight="700">3</text>
    <text x="560" y="280" text-anchor="middle" fill="#F4F1EA" font-size="16" font-weight="700">NeuroEconomics</text>
    <text x="560" y="302" text-anchor="middle" fill="#5A6B85" font-size="12">Decide · Neurofinance</text>

    <circle cx="770" cy="220" r="20" fill="none" stroke="#00E5FF" stroke-width="2" />
    <text x="770" y="227" text-anchor="middle" fill="#00E5FF" font-size="18" font-weight="700">4</text>
    <text x="770" y="280" text-anchor="middle" fill="#F4F1EA" font-size="16" font-weight="700">NEURION Lab</text>
    <text x="770" y="302" text-anchor="middle" fill="#5A6B85" font-size="12">fMRI 연구센터</text>

    <circle cx="1000" cy="220" r="62" fill="none" stroke="#FFB547" stroke-width="1" opacity="0.25" />
    <circle cx="1000" cy="220" r="44" fill="none" stroke="#FFB547" stroke-width="1.5" opacity="0.5" />
    <circle cx="1000" cy="220" r="28" fill="#FFB547" />
    <text x="1000" y="228" text-anchor="middle" fill="#0A1A3A" font-size="22" font-weight="700">5</text>
    <text x="1000" y="285" text-anchor="middle" fill="#FFB547" font-size="17" font-weight="700">Insurance ★</text>
    <text x="1000" y="306" text-anchor="middle" fill="#F4F1EA" font-size="12">Risk · Decision Underwriting</text>
    <text x="1000" y="324" text-anchor="middle" fill="#5A6B85" font-size="11" letter-spacing="2">APEX</text>
